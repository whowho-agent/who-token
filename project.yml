name: Rutoken
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "5"
packages:
  TokenKit:
    path: Packages/TokenKit
targets:
  Rutoken:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Assets.xcassets
    dependencies:
      - package: TokenKit
        product: TokenKit
      - target: RutokenTokenExtension
      - target: RutokenSafariExtension
    entitlements:
      path: App/Rutoken.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(RB_BUNDLE_ID).shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Рутокен
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # rutoken://root?site=… — the Safari extension opens the root certificate screen.
        CFBundleURLTypes:
          - CFBundleURLName: rutoken
            CFBundleURLSchemes: [rutoken]
        # Issuer certificates (AIA "CA Issuers") are published over plain http; the downloaded root is
        # checked against the site's chain and by the fingerprint the user compares.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        RBSharedKeychainGroup: $(AppIdentifierPrefix)$(RB_BUNDLE_ID).shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RB_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RutokenTokenExtension:
    type: app-extension
    platform: iOS
    sources: [App/TokenExtension]
    dependencies:
      - package: TokenKit
        product: TokenKit
        embed: false
    entitlements:
      path: App/TokenExtension/RutokenTokenExtension.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(RB_BUNDLE_ID).shared
    info:
      path: App/TokenExtension/Info.plist
      properties:
        CFBundleDisplayName: Рутокен
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RBSharedKeychainGroup: $(AppIdentifierPrefix)$(RB_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ctk-tokens
          NSExtensionAttributes:
            com.apple.ctk.class-id: $(RB_BUNDLE_ID).TokenExtension
            com.apple.ctk.driver-class: $(PRODUCT_MODULE_NAME).TokenDriver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RB_BUNDLE_ID).TokenExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  # Safari toolbar button with a PIN field: the token extension gets no PIN prompt from iOS,
  # so the PIN is entered here and shared with it through the keychain.
  RutokenSafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: App/SafariExtension/SafariWebExtensionHandler.swift
      - path: App/SafariExtension/Resources/manifest.json
        buildPhase: resources
      - path: App/SafariExtension/Resources/popup.html
        buildPhase: resources
      - path: App/SafariExtension/Resources/popup.css
        buildPhase: resources
      - path: App/SafariExtension/Resources/popup.js
        buildPhase: resources
      - path: App/SafariExtension/Resources/background.js
        buildPhase: resources
      - path: App/SafariExtension/Resources/pin.html
        buildPhase: resources
      - path: App/SafariExtension/Resources/root.html
        buildPhase: resources
      - path: App/SafariExtension/Resources/root.js
        buildPhase: resources
      - path: App/SafariExtension/Resources/root.css
        buildPhase: resources
      - path: App/SafariExtension/Resources/images
        type: folder
        buildPhase: resources
      - path: App/SafariExtension/Resources/_locales
        type: folder
        buildPhase: resources
    dependencies:
      - package: TokenKit
        product: TokenKit
        embed: false
    entitlements:
      path: App/SafariExtension/RutokenSafariExtension.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(RB_BUNDLE_ID).shared
    info:
      path: App/SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Рутокен
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RBSharedKeychainGroup: $(AppIdentifierPrefix)$(RB_BUNDLE_ID).shared
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RB_BUNDLE_ID).SafariExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
