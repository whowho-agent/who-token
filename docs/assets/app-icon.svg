<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F05252"/>
      <stop offset="1" stop-color="#B42318"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECECEC"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9CED6"/>
      <stop offset="0.5" stop-color="#F4F6F8"/>
      <stop offset="1" stop-color="#B8BEC7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A0A0A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="rotate(-38 512 512)" filter="url(#shadow)">
    <!-- USB-C plug -->
    <rect x="452" y="150" width="120" height="140" rx="30" fill="url(#metal)"/>
    <rect x="476" y="176" width="72" height="22" rx="11" fill="#7A828C"/>
    <!-- body with a lanyard hole -->
    <path fill="url(#body)" fill-rule="evenodd" d="
      M 412 270 H 612 Q 690 270 690 348 V 796 Q 690 874 612 874 H 412 Q 334 874 334 796 V 348 Q 334 270 412 270 Z
      M 512 760 m -38 0 a 38 38 0 1 0 76 0 a 38 38 0 1 0 -76 0 Z"/>
    <!-- keyhole -->
    <circle cx="512" cy="478" r="62" fill="#C62828"/>
    <path d="M484 512 L540 512 L560 640 Q562 654 548 654 L476 654 Q462 654 464 640 Z" fill="#C62828"/>
  </g>
</svg>
