<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рутокен</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <h1><img src="images/icon-96.png" alt=""> Рутокен</h1>
  <p id="intro" hidden>Сайт <b id="site"></b> запрашивает сертификат с токена.</p>
  <p id="status">Проверяем…</p>
  <p id="access" class="warn" hidden>Расширению не разрешён доступ к сайтам — без него «Рутокен» не сможет
    подсказать, когда нужен PIN. <button id="grant" type="button" class="link">Разрешить на всех сайтах</button></p>
  <form id="pin-form">
    <input id="pin" type="password" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="PIN пользователя" enterkeyhint="go">
    <button type="submit">Войти</button>
  </form>
  <button id="forget" type="button" hidden>Забыть PIN</button>
  <button id="back" type="button" hidden>Открыть сайт</button>
  <button id="root" type="button" class="link">Сертификат сервера…</button>
  <p class="hint">PIN хранится только на этом устройстве 24 часа. USB-токен должен быть подключён.</p>
</body>
</html>
