<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <h1>Рутокен</h1>
  <p id="status">Проверяем…</p>
  <form id="pin-form">
    <input id="pin" type="password" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="PIN пользователя" enterkeyhint="go">
    <button type="submit">Войти</button>
  </form>
  <button id="forget" type="button" hidden>Забыть PIN</button>
  <p class="hint">PIN хранится на устройстве 24 часа и используется для подписи при входе на сайты
    по сертификату с токена. После ввода обновите страницу.</p>
</body>
</html>
